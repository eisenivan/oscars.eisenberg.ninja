<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#FAF7F0" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0E0D0B" media="(prefers-color-scheme: dark)" />
		<meta name="description" content="Fill out your ballot and follow the live leaderboard for the Eisenberg Oscar party." />
		<meta property="og:title" content="Oscars // Eisenberg" />
		<meta property="og:description" content="Fill out your ballot and follow the live leaderboard for the Eisenberg Oscar party." />
		<meta property="og:type" content="website" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Oscars" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon-32x32.png" sizes="32x32" type="image/png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<title>Oscars // Eisenberg</title>
		<script>
			// Apply the theme before first paint to avoid a flash of the wrong theme.
			(function () {
				try {
					var mode = localStorage.getItem('theme') || 'system';
					var dark =
						mode === 'dark' ||
						(mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					if (dark) document.documentElement.classList.add('dark');
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="svelte" style="display: contents">%sveltekit.body%</div>
	</body>
</html>
